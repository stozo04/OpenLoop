name: Doc layout

# Hard gate: new Markdown files must use the locations listed in docs/README.md.
# Design: docs/README.md § Enforcement

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  markdown-placement:
    name: New .md file placement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fail on new Markdown outside docs/
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
            HEAD='${{ github.event.pull_request.head.sha }}'
          else
            git fetch --no-tags --depth=1 origin "${{ github.event.repository.default_branch }}" || true
            BASE="origin/${{ github.event.repository.default_branch }}"
            HEAD='HEAD'
          fi

          ADDED=$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" -- '*.md' || true)
          if [ -z "$ADDED" ]; then
            echo "No new Markdown files in this diff."
            exit 0
          fi

          echo "New Markdown files:"
          echo "$ADDED"

          VIOLATIONS=""
          for f in $ADDED; do
            case "$f" in
              # Root tool-discovery entry points, not documentation. Every LLM harness looks for its
              # own filename at the repo ROOT and nowhere else — Claude Code reads CLAUDE.md, Codex /
              # Cursor / Copilot read AGENTS.md — so these cannot live under docs/ and still function.
              # The pointers also load the owner's shared Engineering-Prompt.md from the root.
              README.md|CLAUDE.md|AGENTS.md|Engineering-Prompt.md)
                ;;
              docs/*)
                ;;
              # Agent-harness Markdown, not product documentation. `swarm/` is a self-contained
              # multi-agent workspace whose briefs and durable output are deliberately tracked —
              # .gitignore states it explicitly ("The durable output (decisions.md, LESSONS.md,
              # research-*.md) IS tracked") — and `.claude/` / `.cursor/` / `.codex/` hold slash-command
              # and skill packages (`SKILL.md`). None of that is the product docs this gate
              # exists to keep tidy.
              swarm/*|.claude/*|.cursor/*|.codex/*)
                ;;
              *)
                VIOLATIONS="${VIOLATIONS}${f}\n"
                ;;
            esac
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::New Markdown must use the allowed locations in docs/README.md."
            printf '%b' "$VIOLATIONS"
            exit 1
          fi

          echo "All new Markdown files are in allowed locations."

name: Static analysis (text gates)

# CI backstop for the text half of the pre-PR sweep (scripts/pre-pr-sweep.ps1 gates 6–8): Markdown
# structure, IDE-faithful table alignment, relative links, harness skill-tree identity, spelling over
# every tracked text file, JSON validity, and the cspell ↔ IDE-dictionary sync. Every step is a HARD gate — the tree is at zero and
# there is no baseline, so a red step means the PR introduced it. Design: docs/STATIC_ANALYSIS.md.
#
# Deliberately whole-repo, not changed-files-only: with no baseline that is the only honest scope.

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  text-gates:
    name: Markdown · spelling · JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: markdownlint-cli2 (0 findings)
        run: npx --yes markdownlint-cli2 $(git ls-files '*.md')

      - name: Table alignment (0 misaligned)
        run: python scripts/md-table-align.py

      - name: markdown-link-check (0 dead relative links)
        run: |
          set -o pipefail
          dead=0
          for f in $(git ls-files '*.md'); do
            npx --yes markdown-link-check --config .markdown-link-check.json -q "$f" | tee -a link-check.log || dead=1
          done
          exit $dead

      # Three harnesses, one set of skills. Drift is silent and leaves no copy authoritative.
      - name: Harness skill trees byte-identical (0 drift)
        run: python scripts/sync-harness-skills.py --check

      - name: cspell (0 unknown words)
        run: |
          git ls-files '*.md' '*.kt' '*.kts' '*.xml' '*.yml' '*.yaml' '*.ps1' '*.py' '*.mjs' '*.js' \
            '*.json' '*.jsonc' '*.properties' '*.html' '*.toml' '*.pro' '*.template' '*.README' '*.txt' '*.dic' \
            | npx --yes cspell --no-progress --file-list stdin   # `--file-list <path>` can exit 1 silently on Windows; stdin is uniform

      - name: JSON validity + IDE dictionary in sync
        run: |
          python - <<'EOF'
          import json, re, subprocess, sys
          bad = []
          for f in subprocess.check_output(["git", "ls-files", "*.json"], text=True).split():
              raw = open(f, encoding="utf-8").read()
              if f == "cspell.json":
                  raw = re.sub(r"^\s*//.*$", "", raw, flags=re.M)
              try:
                  json.loads(raw)
              except Exception as e:
                  bad.append(f"{f}: {e}")
          print("\n".join(bad) or "all JSON valid")
          sys.exit(1 if bad else 0)
          EOF
          python scripts/sync-ide-dictionary.py --check

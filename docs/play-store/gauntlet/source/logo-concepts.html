<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face { font-family:"Space Grotesk"; src:url("../../../../app/src/main/res/font/space_grotesk.ttf"); }
    @font-face { font-family:"Inter"; src:url("../../../../app/src/main/res/font/inter.ttf"); }
    :root { --lime:#cdff4f; --ink:#15200a; --aqua:#34e1d5; --cream:#fff8e9; --paper:#f6f2e8; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; background:#ddd; }
    body { display:grid; place-items:center; }
    .artboard {
      position:relative;
      width:1024px;
      height:500px;
      overflow:hidden;
      font-family:Inter,Arial,sans-serif;
      color:var(--ink);
      isolation:isolate;
    }
    .logo {
      position:absolute;
      object-fit:contain;
      filter:drop-shadow(0 18px 28px rgba(21,32,10,.18));
    }
    .name {
      position:absolute;
      margin:0;
      font:700 62px/.92 "Space Grotesk",sans-serif;
      letter-spacing:-.055em;
      text-transform:uppercase;
    }
    .descriptor {
      position:absolute;
      margin:0;
      font:600 24px/1 "Inter",sans-serif;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .tool-ribbon {
      position:absolute;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .tool {
      display:flex;
      align-items:center;
      gap:7px;
      padding:9px 13px;
      border-radius:999px;
      white-space:nowrap;
      font:700 12px/1 "Inter",sans-serif;
      letter-spacing:.045em;
      text-transform:uppercase;
    }
    .tool i {
      display:block;
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--lime);
      box-shadow:0 0 0 4px rgba(205,255,79,.12);
    }
    .benefit-ribbon {
      position:absolute;
      left:50%;
      bottom:20px;
      display:flex;
      align-items:center;
      gap:12px;
      transform:translateX(-50%);
      filter:drop-shadow(0 10px 18px rgba(21,32,10,.18));
    }
    .benefit {
      position:relative;
      min-width:172px;
      padding:13px 24px;
      text-align:center;
      font:800 13px/1 "Inter",sans-serif;
      letter-spacing:.08em;
      text-transform:uppercase;
      border-radius:10px;
    }
    .benefit span { margin-right:7px; }

    /* A: simple light */
    .a {
      background:
        radial-gradient(circle at 18% 16%,rgba(205,255,79,.50),transparent 26%),
        radial-gradient(circle at 84% 20%,rgba(52,225,213,.28),transparent 25%),
        var(--cream);
    }
    .a::before {
      content:"∞";
      position:absolute;
      left:-45px;
      top:12px;
      color:rgba(21,32,10,.035);
      font:700 660px/.7 "Space Grotesk";
      z-index:-1;
    }
    .a .logo { left:366px; top:21px; width:292px; height:176px; }
    .a .name { left:0; right:0; top:186px; text-align:center; }
    .a .descriptor { left:0; right:0; top:252px; text-align:center; color:#4b5a3a; }
    .a .tool-ribbon { left:0; right:0; top:313px; }
    .a .tool { color:#f3f3f6; background:#17171d; box-shadow:0 9px 20px rgba(21,32,10,.12); }
    .a .benefit { color:var(--ink); background:var(--lime); }
    .a .benefit:last-child { background:var(--aqua); }

    /* B: store-scale horizontal lockup */
    .b {
      color:var(--ink);
      background:
        radial-gradient(circle at 5% 12%,rgba(205,255,79,.92),transparent 32%),
        radial-gradient(circle at 96% 92%,rgba(52,225,213,.58),transparent 34%),
        linear-gradient(135deg,#efffd5 0%,#c4f8d8 48%,#9cecdf 100%);
    }
    .b::before,.b::after {
      content:"";
      position:absolute;
      width:430px;
      height:430px;
      border:2px solid rgba(21,32,10,.055);
      border-radius:50%;
      z-index:-1;
    }
    .b::before { left:-248px; top:-176px; }
    .b::after { right:-230px; bottom:-220px; }
    .b .logo {
      left:78px;
      top:126px;
      width:292px;
      height:176px;
      filter:drop-shadow(0 16px 22px rgba(21,32,10,.24));
    }
    .b .name {
      left:405px;
      top:48px;
      font-size:82px;
      letter-spacing:-.065em;
      text-shadow:none;
    }
    .b .descriptor {
      left:410px;
      top:136px;
      color:#284c3e;
      font-size:30px;
      font-weight:800;
      letter-spacing:.075em;
    }
    .b .descriptor::before {
      content:"▶";
      display:inline-block;
      margin-right:12px;
      color:#168b7f;
      font-size:20px;
      transform:translateY(-2px);
    }
    .b .tool-ribbon {
      left:405px;
      top:205px;
      width:500px;
      justify-content:flex-start;
      flex-wrap:wrap;
      gap:12px 14px;
    }
    .b .tool {
      width:232px;
      min-height:54px;
      justify-content:center;
      padding:15px 17px;
      color:#fff;
      background:#173b35;
      border:2px solid rgba(255,255,255,.78);
      box-shadow:0 8px 16px rgba(21,32,10,.16);
      font-size:20px;
      letter-spacing:.025em;
    }
    .b .tool i {
      width:9px;
      height:9px;
      box-shadow:none;
    }
    .b .benefit-ribbon {
      left:405px;
      bottom:28px;
      gap:16px;
      transform:none;
    }
    .b .benefit {
      min-width:232px;
      padding:18px 22px;
      color:var(--ink);
      background:#d7ff63;
      border:2px solid rgba(21,32,10,.16);
      border-radius:16px;
      box-shadow:0 10px 18px rgba(21,32,10,.15);
      font-size:22px;
      letter-spacing:.055em;
    }
    .b .benefit:last-child { background:#63e7dc; }

    /* C: electric-lime poster */
    .c {
      background:
        radial-gradient(circle at 88% 12%,rgba(52,225,213,.52),transparent 24%),
        linear-gradient(145deg,#ddff85,var(--lime) 58%,#b4ec2e);
    }
    .c::before {
      content:"";
      position:absolute;
      width:660px;
      height:660px;
      left:182px;
      top:-450px;
      border:56px solid rgba(21,32,10,.06);
      border-radius:50%;
      z-index:-1;
    }
    .c .logo { left:64px; top:40px; width:374px; height:226px; filter:drop-shadow(0 18px 26px rgba(21,32,10,.28)); }
    .c .name { left:474px; top:79px; width:500px; font-size:73px; }
    .c .descriptor { left:478px; top:158px; width:460px; font-size:22px; color:#425128; }
    .c .tool-ribbon { left:460px; top:222px; width:520px; flex-wrap:wrap; justify-content:flex-start; }
    .c .tool { color:#f3f3f6; background:var(--ink); }
    .c .benefit-ribbon { bottom:25px; }
    .c .benefit { min-width:206px; color:#f3f3f6; background:var(--ink); }
    .c .benefit:last-child { color:var(--ink); background:var(--aqua); }
  </style>
</head>
<body>
  <div class="artboard a" data-concept="a">
    <img class="logo" src="../references/openloop-logo-crop.png" alt="">
    <h1 class="name">Boomerang</h1>
    <p class="descriptor">Video Loop Maker</p>
    <div class="tool-ribbon">
      <span class="tool"><i></i>Filter</span><span class="tool"><i></i>Trim</span><span class="tool"><i></i>Speed</span><span class="tool"><i></i>Loop Direction</span>
    </div>
    <div class="benefit-ribbon">
      <span class="benefit">Ad-Free</span><span class="benefit">No Sign-Ups</span>
    </div>
  </div>

  <div class="artboard b" data-concept="b">
    <img class="logo" src="../references/openloop-logo-crop.png" alt="">
    <h1 class="name">Boomerang</h1>
    <p class="descriptor">Video Loop Maker</p>
    <div class="tool-ribbon">
      <span class="tool"><i></i>Filter</span><span class="tool"><i></i>Trim</span><span class="tool"><i></i>Speed</span><span class="tool"><i></i>Loop Direction</span>
    </div>
    <div class="benefit-ribbon">
      <span class="benefit">Ad-Free</span><span class="benefit">No Sign-Ups</span>
    </div>
  </div>

  <div class="artboard c" data-concept="c">
    <img class="logo" src="../references/openloop-logo-crop.png" alt="">
    <h1 class="name">Boomerang</h1>
    <p class="descriptor">Video Loop Maker</p>
    <div class="tool-ribbon">
      <span class="tool"><i></i>Filter</span><span class="tool"><i></i>Trim</span><span class="tool"><i></i>Speed</span><span class="tool"><i></i>Loop Direction</span>
    </div>
    <div class="benefit-ribbon">
      <span class="benefit">Ad-Free</span><span class="benefit">No Sign-Ups</span>
    </div>
  </div>
  <script>
    const wanted = new URLSearchParams(location.search).get("concept") || "a";
    document.querySelectorAll("[data-concept]").forEach((node) => {
      node.style.display = node.dataset.concept === wanted ? "block" : "none";
    });
  </script>
</body>
</html>
